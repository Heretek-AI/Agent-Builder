id: geonode-mcp-server
name: Geonode MCP Server
repo: https://github.com/geonodecom/mcp
tagline: Web search and content collection for MCP-compatible agents.
description: >-
  Give MCP-compatible AI assistants web search and content collection tools. Extract pages, discover
  URLs, crawl sites and run batches for research and downstream analysis. Geonode offers limited
  keyless page extraction; an API key enables the full toolset, including JavaScript rendering and
  country targeting.


  Supported functions:

  • Extract webpage content from a compatible AI assistant or coding tool.

  • Try basic synchronous page extraction without an API key, within anonymous limits.

  • Use an API key for URL discovery, crawls, web search and batch jobs.

  • Access JavaScript rendering and country targeting with authenticated requests.

  • Monitor long-running extraction and crawl jobs from your MCP client.


  Turn a page into context: Extract a page as Markdown for your assistant to read.


  MCP server URL: https://mcp.geonode.com/mcp


  Try limited keyless page extraction through a compatible MCP client. Sign up and connect your
  Geonode API key to access additional features and the usage limits included in your plan.


  Try Geonode for free: https://app.geonode.com/signup


  Learn more: https://geonode.com
kind: mcp-server
category: mcp-servers/browser-web
