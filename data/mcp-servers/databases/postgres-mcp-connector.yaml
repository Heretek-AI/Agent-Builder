id: postgres-mcp-connector
name: Postgres MCP Connector
repo: https://github.com/kristofer84/mcp-postgres
tagline: Read-only Postgres MCP server with audited tools.
description: >-
  An MCP server connector for PostgreSQL exposing query, list-tables, and schema inspection tools
  for least-privilege database agents.
kind: mcp-server
category: mcp-servers/databases
harnesses:
  - opencode
  - claude-code
mcp:
  server_name: postgres-prod
  transport: stdio
  command: npx
  args:
    - '-y'
    - mcp-postgres
  tools:
    # Tool names per the published mcp-postgres@1.4.2 README (Available Tools):
    # execute_query, list_tables, describe_table (get_schema/get_table_sample omitted).
    - execute_query
    - list_tables
    - describe_table
  resources:
    - schema
tags:
  - postgres
  - sql
license: MIT
source_attribution: Curated for Agent-Builder; inspired by kristofer84/mcp-postgres (MIT).
synthetic: false
