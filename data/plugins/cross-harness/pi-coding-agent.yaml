id: pi-coding-agent
name: Pi Coding Agent
repo: https://github.com/earendil-works/pi
path: packages/coding-agent
npm: "@earendil-works/pi-coding-agent"
tagline: Minimal extensible Pi coding-agent CLI with read, bash, edit, and session tools.
description: >-
  earendil-works/pi (MIT) is the Pi coding-agent harness: a minimal extensible agent loop with a
  unified LLM API, TUI, print/JSON automation modes, RPC, and the @earendil-works/pi-coding-agent
  CLI (read, bash, edit, write tools plus session management). Pi packages bundle extensions,
  skills, prompt templates, and themes for sharing via npm or git.
kind: plugin
category: plugins/cross-harness
harnesses:
  - universal
tags:
  - pi
  - pi-package
  - coding-agent
  - tui
  - cross-harness
installation: npm install -g --ignore-scripts @earendil-works/pi-coding-agent@1.3.0
license: MIT
source_attribution: Curated for Agent-Builder; inspired by earendil-works/pi (MIT).
