name: AI Review

"on":
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Collect PR changes
        run: node scripts/ai-review.js collect
      - name: Run AI review
        run: node scripts/ai-review.js run
      - name: Self-test review pipeline
        run: node scripts/ai-review.js selftest
