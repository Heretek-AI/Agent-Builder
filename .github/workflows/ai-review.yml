name: AI Review

"on":
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ai-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.3
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Collect PR changes
        run: node scripts/ai-review.js collect
      - name: Run AI review
        run: node scripts/ai-review.js run
      - name: Self-test review pipeline
        run: node scripts/ai-review.js selftest
