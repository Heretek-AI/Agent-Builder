name: Validate PR

"on":
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22.23.3', '24.22.0']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Unit tests
        run: npm test
      - name: Check catalog changes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Compare against the current base branch, not pull_request.base.sha: on an older PR that is the base
          # commit from when the PR was opened, which would count everything merged since as part of the PR.
          # fetch-depth: 0 above fetches the full history, so origin/<base> is
          # already present without an extra `git fetch` step.
          BASE_REF: origin/${{ github.event.pull_request.base.ref || 'main' }}
          # Only the README bot's own PRs (opened by github-actions[bot] from this repo's bot/readme-* branches)
          # may change the generated files
          ALLOW_GENERATED: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login == 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'bot/readme-') }}
        run: |
          if [ "$ALLOW_GENERATED" = "true" ]; then
            node scripts/check-pr.js --base "$BASE_REF" --allow-generated
          else
            node scripts/check-pr.js --base "$BASE_REF"
          fi
      - name: README and registry still generate
        run: |
          node scripts/generate-readme.js
          node scripts/export-json.js --output "$RUNNER_TEMP/registry.json"
