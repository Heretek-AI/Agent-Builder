name: Scout multi-harness candidates

"on":
  schedule:
    - cron: 0 7 * * 1
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.3
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      # Live discovery (NOT `npm run scout`, which is the offline --dry-run
      # alias kept safe for local use). --limit 30 covers the wider
      # multi-harness/topic search space (default 20 is opencode-sized).
      - name: Find candidates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/scout.js run --limit 30
