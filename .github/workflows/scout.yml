name: Weekly Discovery Scout

"on":
  schedule:
    - cron: 0 7 * * 1
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run discovery scout
        run: npm run scout
