name: Convert Entry Issues to PRs

"on":
  issues:
    types:
      - opened

permissions:
  contents: read

jobs:
  convert:
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, 'new-entry') || contains(github.event.issue.labels.*.name, 'new-agent') || contains(github.event.issue.labels.*.name, 'publish-agent')
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.3
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Save issue payload
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          node -e "const fs=require('fs'); fs.writeFileSync('issue.json', JSON.stringify({ number: process.env.ISSUE_NUMBER, title: process.env.ISSUE_TITLE, body: process.env.ISSUE_BODY }));"
      - name: Convert issue to catalog entry
        run: node scripts/submit-entry.js --issue issue.json --dry-run
