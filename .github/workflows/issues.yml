name: Convert Entry Issues to PRs

"on":
  issues:
    types:
      - opened
      - edited
      - reopened
      - labeled
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to convert or process (optional)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  convert:
    concurrency:
      group: convert-issue-${{ github.event.issue.number || inputs.issue_number || github.run_id }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    if: >-
      (
        github.event_name == 'issues' && (
          contains(github.event.issue.labels.*.name, 'new-entry') ||
          contains(github.event.issue.labels.*.name, 'new-agent') ||
          contains(github.event.issue.labels.*.name, 'publish-agent') ||
          startsWith(github.event.issue.title, '[entry]') ||
          startsWith(github.event.issue.title, '[agent]') ||
          startsWith(github.event.issue.title, 'Publish agent:')
        )
      ) || (
        github.event_name == 'workflow_dispatch' && inputs.issue_number != ''
      )
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.3
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Save issue payload
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
          ISSUE_TITLE: ${{ github.event.issue.title || '' }}
          ISSUE_BODY: ${{ github.event.issue.body || '' }}
        run: |
          node -e "const fs=require('fs'); fs.writeFileSync('issue.json', JSON.stringify({ number: process.env.ISSUE_NUMBER, title: process.env.ISSUE_TITLE, body: process.env.ISSUE_BODY }));"
      - name: Convert issue to catalog entry and open PR
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/submit-entry.js --issue issue.json --open-pr

  scout-accept:
    concurrency:
      group: issue-${{ github.event.issue.number || inputs.issue_number || github.run_id }}
      cancel-in-progress: false
    if: >-
      (
        github.event_name == 'issues' &&
        contains(github.event.issue.labels.*.name, 'scout')
      ) || (
        github.event_name == 'workflow_dispatch' && inputs.issue_number != ''
      )
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.3
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      # Issue text is untrusted: it is only read by scripts/scout.js as data
      # via the API. ISSUE_NUMBER/SENDER pass as env then argv; nothing from
      # the issue body is interpolated into shell commands.
      - name: Open PRs for ticked candidates
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
          SENDER: ${{ github.event.sender.login }}
        run: node scripts/scout.js accept --issue "$ISSUE_NUMBER" --sender "$SENDER"
