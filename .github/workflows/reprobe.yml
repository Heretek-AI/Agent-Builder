name: Re-probe Pending Entries

"on":
  schedule:
    - cron: 30 6 * * 1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reprobe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Re-probe pending entries
        run: node scripts/reprobe.js
